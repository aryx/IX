<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 960" width="1280" height="960" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#57606a"/></marker></defs>
<rect width="1280" height="960" fill="#ffffff"/>
<text x="30" y="40" font-size="24" font-weight="600" fill="#1f2328" text-anchor="start">Who builds what in ix</text>
<text x="30" y="64" font-size="13" font-weight="normal" fill="#57606a" text-anchor="start">Three toolchains. An arrow goes from a toolchain to what it builds; each band below a toolchain is its scope, then where the result runs.</text>
<rect x="330" y="90" width="480" height="86" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/>
<text x="350" y="116" font-size="17" font-weight="600" fill="#1f2328" text-anchor="start">OCaml 4.14 + dune</text>
<text x="690" y="116" font-size="12" font-weight="normal" fill="#57606a" text-anchor="start" font-style="italic">from outside ix</text>
<text x="350" y="140" font-size="13" font-weight="normal" fill="#1f2328" text-anchor="start">with gcc, and from opam: caps, fpath, tsdl (SDL)</text>
<text x="350" y="159" font-size="13" font-weight="normal" fill="#1f2328" text-anchor="start">run by: make</text>
<rect x="900" y="90" width="350" height="86" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/>
<text x="916" y="114" font-size="13" font-weight="600" fill="#1f2328" text-anchor="start">Only dune builds these</text>
<text x="916" y="133" font-size="13" font-weight="normal" fill="#1f2328" text-anchor="start">mini-qemu and tiny-machine-window (they link SDL),</text>
<text x="916" y="152" font-size="13" font-weight="normal" fill="#1f2328" text-anchor="start">and the tests</text>
<line x1="810" y1="133" x2="898" y2="133" stroke="#57606a" stroke-width="2" marker-end="url(#a)"/>
<rect x="30" y="250" width="570" height="150" rx="8" fill="#ddf4ff" stroke="#218bff" stroke-width="1.5"/>
<text x="50" y="278" font-size="17" font-weight="600" fill="#1f2328" text-anchor="start">m-ix toolchain</text>
<text x="50" y="304" font-size="13" font-weight="normal" fill="#1f2328" text-anchor="start">run by: mini-mk, reading the mkfiles</text>
<text x="50" y="323" font-size="13" font-weight="normal" fill="#1f2328" text-anchor="start">OCaml:  mini-ml, mini-lex, mini-yacc</text>
<text x="50" y="342" font-size="13" font-weight="normal" fill="#1f2328" text-anchor="start">C and assembly:  mini-cc, mini-asm</text>
<text x="50" y="361" font-size="13" font-weight="normal" fill="#1f2328" text-anchor="start">link:  mini-ar, mini-ld</text>
<rect x="680" y="250" width="570" height="150" rx="8" fill="#fff1e5" stroke="#e16f24" stroke-width="1.5"/>
<text x="700" y="278" font-size="17" font-weight="600" fill="#1f2328" text-anchor="start">t-ix toolchain</text>
<text x="700" y="304" font-size="13" font-weight="normal" fill="#1f2328" text-anchor="start">run by: make, reading the Makefiles of tiny-os/ and TinyKernel/</text>
<text x="700" y="323" font-size="13" font-weight="normal" fill="#1f2328" text-anchor="start">compile:  tiny-c (C), tiny-ml (ML)</text>
<text x="700" y="342" font-size="13" font-weight="normal" fill="#1f2328" text-anchor="start">assemble and link:  tiny-cpu, tiny-machine (.tm); tiny-assembler (arm64)</text>
<text x="700" y="361" font-size="13" font-weight="normal" fill="#1f2328" text-anchor="start">disks:  tiny-mkfs</text>
<line x1="450" y1="176" x2="320" y2="248" stroke="#57606a" stroke-width="2" marker-end="url(#a)"/>
<text x="378" y="228" font-size="12" font-weight="normal" fill="#57606a" text-anchor="start" font-style="italic">make: the first build</text>
<line x1="690" y1="176" x2="960" y2="248" stroke="#57606a" stroke-width="2" marker-end="url(#a)"/>
<text x="850" y="216" font-size="12" font-weight="normal" fill="#57606a" text-anchor="start" font-style="italic">make</text>
<line x1="600" y1="310" x2="678" y2="310" stroke="#57606a" stroke-width="2" marker-end="url(#a)"/>
<text x="640" y="300" font-size="12" font-weight="normal" fill="#57606a" text-anchor="middle" font-style="italic">make ix</text>
<text x="640" y="332" font-size="11" font-weight="normal" fill="#57606a" text-anchor="middle" font-style="italic">(tiny/mkfile)</text>
<path d="M 60 250 C 60 206, 150 206, 150 248" fill="none" stroke="#57606a" stroke-width="2" marker-end="url(#a)"/>
<text x="30" y="208" font-size="12" font-weight="normal" fill="#57606a" text-anchor="start" font-style="italic">make ix: it rebuilds itself, the same bytes</text>
<text x="1250" y="236" font-size="12" font-weight="normal" fill="#57606a" text-anchor="end" font-style="italic">no loop: t-ix does not build its own tools</text>
<text x="30" y="458" font-size="11" font-weight="600" fill="#57606a" text-anchor="start">ITS SCOPE</text>
<line x1="315" y1="400" x2="315" y2="468" stroke="#57606a" stroke-width="2" marker-end="url(#a)"/>
<rect x="30" y="470" width="570" height="250" rx="8" fill="#ffffff" stroke="#218bff" stroke-width="1.5"/>
<text x="50" y="498" font-size="13" font-weight="600" fill="#1f2328" text-anchor="start">All of ix's OCaml and C</text>
<text x="50" y="517" font-size="13" font-weight="normal" fill="#1f2328" text-anchor="start">itself, and lib_core/: the standard library, the C library,</text>
<text x="50" y="536" font-size="13" font-weight="normal" fill="#1f2328" text-anchor="start">    mini-ml's runtime</text>
<text x="50" y="555" font-size="13" font-weight="normal" fill="#1f2328" text-anchor="start">the mini programs: mini-rc, mini-ed, mini-git, mini-awk,</text>
<text x="50" y="574" font-size="13" font-weight="normal" fill="#1f2328" text-anchor="start">    the utilities, mini-rio, the games...</text>
<text x="50" y="593" font-size="13" font-weight="normal" fill="#1f2328" text-anchor="start">the kernels: mini-xv6, mini-9pi (make kernels-ix)</text>
<text x="50" y="612" font-size="13" font-weight="normal" fill="#1f2328" text-anchor="start">the emulator of user programs: mini-5i</text>
<text x="50" y="631" font-size="13" font-weight="normal" fill="#1f2328" text-anchor="start">t-ix's own tools, the tiny-xxx (OCaml programs too)</text>
<text x="50" y="650" font-size="13" font-weight="normal" fill="#1f2328" text-anchor="start"></text>
<text x="50" y="669" font-size="13" font-weight="normal" fill="#1f2328" text-anchor="start">not: mini-qemu, tiny-machine-window (SDL), the tests</text>
<line x1="820" y1="400" x2="820" y2="468" stroke="#57606a" stroke-width="2" marker-end="url(#a)"/>
<line x1="1110" y1="400" x2="1110" y2="468" stroke="#57606a" stroke-width="2" marker-end="url(#a)"/>
<rect x="680" y="470" width="290" height="250" rx="8" fill="#ffffff" stroke="#e16f24" stroke-width="1.5"/>
<text x="696" y="498" font-size="13" font-weight="600" fill="#1f2328" text-anchor="start">For the tiny machine (-tm)</text>
<text x="696" y="517" font-size="13" font-weight="normal" fill="#1f2328" text-anchor="start">tiny-os/libc: the C runtime</text>
<text x="696" y="536" font-size="13" font-weight="normal" fill="#1f2328" text-anchor="start">tiny-os v0, v6, t6: kernels in</text>
<text x="696" y="555" font-size="13" font-weight="normal" fill="#1f2328" text-anchor="start">    assembly and C, their programs</text>
<text x="696" y="574" font-size="13" font-weight="normal" fill="#1f2328" text-anchor="start">TinyKernel.ml: a kernel in ML,</text>
<text x="696" y="593" font-size="13" font-weight="normal" fill="#1f2328" text-anchor="start">    its programs (C)</text>
<rect x="696" y="620" width="258" height="86" rx="8" fill="#fff1e5" stroke="#e16f24" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="708" y="642" font-size="12" font-weight="600" fill="#1f2328" text-anchor="start">planned (plan_tiny_windows.md)</text>
<text x="708" y="660" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="start">TinyGraphics, TinyWindows,</text>
<text x="708" y="678" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="start">TinyPlayground, TinyTetris</text>
<rect x="990" y="470" width="260" height="250" rx="8" fill="#ffffff" stroke="#e16f24" stroke-width="1.5"/>
<text x="1006" y="498" font-size="13" font-weight="600" fill="#1f2328" text-anchor="start">For arm64: tests only</text>
<text x="1006" y="517" font-size="13" font-weight="normal" fill="#1f2328" text-anchor="start">17 ML and 11 C test programs,</text>
<text x="1006" y="536" font-size="13" font-weight="normal" fill="#1f2328" text-anchor="start">    with goken's C library</text>
<text x="1006" y="555" font-size="13" font-weight="normal" fill="#1f2328" text-anchor="start">    (outside ix)</text>
<text x="1006" y="574" font-size="13" font-weight="normal" fill="#1f2328" text-anchor="start">a kernel's page for tiny-pi</text>
<text x="1006" y="593" font-size="13" font-weight="normal" fill="#1f2328" text-anchor="start"></text>
<text x="1006" y="612" font-size="13" font-weight="normal" fill="#1f2328" text-anchor="start">no program of ix is built</text>
<text x="1006" y="631" font-size="13" font-weight="normal" fill="#1f2328" text-anchor="start">this way</text>
<text x="30" y="778" font-size="11" font-weight="600" fill="#57606a" text-anchor="start">WHERE THE RESULT RUNS</text>
<line x1="315" y1="720" x2="315" y2="788" stroke="#57606a" stroke-width="2" marker-end="url(#a)"/>
<line x1="825" y1="720" x2="825" y2="788" stroke="#57606a" stroke-width="2" marker-end="url(#a)"/>
<line x1="1120" y1="720" x2="1120" y2="788" stroke="#57606a" stroke-width="2" marker-end="url(#a)"/>
<rect x="30" y="790" width="570" height="96" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/>
<text x="50" y="816" font-size="13" font-weight="normal" fill="#1f2328" text-anchor="start">arm64 and arm programs: on Linux, or under mini-5i</text>
<text x="50" y="835" font-size="13" font-weight="normal" fill="#1f2328" text-anchor="start">Plan 9 programs: on mini-9pi</text>
<text x="50" y="854" font-size="13" font-weight="normal" fill="#1f2328" text-anchor="start">kernels: on the Pi (mini-qemu, QEMU, the real boards)</text>
<rect x="680" y="790" width="290" height="96" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/>
<text x="696" y="816" font-size="13" font-weight="normal" fill="#1f2328" text-anchor="start">tiny-cpu: a program alone</text>
<text x="696" y="835" font-size="13" font-weight="normal" fill="#1f2328" text-anchor="start">tiny-machine: a kernel and</text>
<text x="696" y="854" font-size="13" font-weight="normal" fill="#1f2328" text-anchor="start">    its processes</text>
<rect x="990" y="790" width="260" height="96" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/>
<text x="1006" y="816" font-size="13" font-weight="normal" fill="#1f2328" text-anchor="start">tiny-arm, tiny-pi, mini-5i,</text>
<text x="1006" y="835" font-size="13" font-weight="normal" fill="#1f2328" text-anchor="start">a real arm64 CPU</text>
<text x="30" y="932" font-size="12" font-weight="normal" fill="#57606a" text-anchor="start">The emulators (mini-5i, mini-qemu, tiny-cpu, tiny-machine, tiny-arm, tiny-pi) are OCaml programs like the others: built by dune, and all but mini-qemu by m-ix.</text>
</svg>
